[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "authsources"
version = "0.5"
authors = [
    {name = "Souheil Chelfouh", email = "trollfot@gmail.com"},
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "frozendict",
  "jsonschema_rs",
  "setuptools",
  "wrapt",
]

[project.optional-dependencies]
test = [
    'pytest',
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["authsources"]
namespaces = false
